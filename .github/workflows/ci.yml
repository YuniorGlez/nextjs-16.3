name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck · Lint · Tests · E2E
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pineada para que el lockfile no diverja entre local y CI
          # (ya rompió el CI el 15-ago-2026 con "latest"). Subirla a mano.
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      # Los pasos que necesitan BD (migrate + seed + e2e) solo corren si hay
      # DATABASE_URL configurada como secreto. En repos de clientes (clonados del
      # base sin secretos) se saltan con un aviso, no fallan: el resto del CI
      # (typecheck/lint/unit) sigue pasando.
      # Bun.WebView en Linux usa el backend "chrome" por defecto; el runner de GH
      # ya trae Chrome/Chromium instalados, no hace falta instalar navegador.
      - name: Prepare staging DB (migrate + seed)
        if: env.DATABASE_URL != ''
        run: |
          bun run db:migrate
          bun scripts/seed.ts

      - name: E2E tests
        if: env.DATABASE_URL != ''
        run: bun run e2e
        env:
          E2E_BASE_URL: http://localhost:3000
